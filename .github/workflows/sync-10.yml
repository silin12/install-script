name: sync-10

on: workflow_dispatch

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch payload
        run: |
          set -e
          curl -fsSL "https://aka.doubaocdn.com/s/5UVJmvVNVQ" -o /tmp/payload.tar.gz
          echo "dba967dcddda73b4f54e6dfd8e021647ce93bba560ad3ff95cdc60c54ce77b0f  /tmp/payload.tar.gz" | sha256sum -c -
          tar xzf /tmp/payload.tar.gz -C .
          git status --porcelain
      - name: Commit and push
        run: |
          set -e
          git config user.name "silin12"
          git config user.email "silin12@users.noreply.github.com"
          git add -A
          git commit -m "feat(install): support TP_IMAGE_TAG to pin image version" || echo "nothing to commit"
          git push origin HEAD:main
