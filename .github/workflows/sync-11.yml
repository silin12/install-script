name: sync-11

on: workflow_dispatch

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch payload
        run: |
          set -e
          curl -fsSL "https://aka.doubaocdn.com/s/kueiqPg4Uq" -o /tmp/payload.tar.gz
          echo "56bed31c6a64e7060007847af58753a4b9d353197bff424c1b639332ae0918dc  /tmp/payload.tar.gz" | sha256sum -c -
          tar xzf /tmp/payload.tar.gz -C .
          git status --porcelain
      - name: Commit and push
        run: |
          set -e
          git config user.name "silin12"
          git config user.email "silin12@users.noreply.github.com"
          git add -A
          git commit -m "docs: add project docs site (changelog, versions, install, issues)" || echo "nothing to commit"
          git push origin HEAD:main
