name: Sync install script

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch script
        run: |
          set -e
          curl -fsSL "https://aka.doubaocdn.com/s/yDpmQt8o8A" -o /tmp/new.sh
          head -1 /tmp/new.sh
          wc -c /tmp/new.sh
          sha256sum /tmp/new.sh

      - name: Verify and replace
        run: |
          set -e
          expected=a36714ca35acf2f924c17a70fd26d48873f154afb68e8c0a6affc1f1b2425e14
          actual=$(sha256sum /tmp/new.sh | cut -d' ' -f1)
          test "$actual" = "$expected"
          cp /tmp/new.sh install_script.sh
          git diff --stat

      - name: Commit
        run: |
          set -e
          git config user.name "silin12"
          git config user.email "silin12@users.noreply.github.com"
          git add install_script.sh
          git commit -m "fix: wait for node_server table before registering panel server" || exit 0
          git push
